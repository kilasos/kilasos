name: release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: bash scripts/build-multiarch.sh

      - name: Build .deb packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          bash scripts/build-deb.sh

      - name: Build OCI image
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/nasd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Generate SHA256SUMS
        run: ( cd bin && sha256sum * > SHA256SUMS )

      - name: Sign SHA256SUMS (conditional)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --passphrase "$GPG_PASSPHRASE" --detach-sign --armor bin/SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/nasd-linux-*
            bin/SHA256SUMS
            bin/SHA256SUMS.asc
            dist/*.deb
          generate_release_notes: true
