
defaultGroups:
  - kilasos
  - docker

# Whether to prompt for root password during installation
setRootPassword: false

# Minimum password length for user accounts
minLength: 8

# Enable or disable automatic login for the default user
doAutologin: false

# Additional settings (optional, not part of core config but often used)
# autoLoginUser: ""  # Uncomment and set username if autologin is desired
# passwordHash: "SHA512"  # Uncomment to enforce specific hash algorithm
