# Calamares partition configuration for ZFS-based installation
# This configuration defines the partitioning scheme for a ZFS root pool

efiSystemPartition:
  efi: true
  efiSysPartition: /boot/efi
  efiSysPartitionSize: 512MiB
  efiSysPartitionLabel: EFI System Partition

defaultFileSystemType: zfs

zfs:
  poolName: rpool
  datasets:
    - name: rpool/ROOT
      mountpoint: /
      options:
        - compression=zstdict
        - xattr=standard
        - relatime=on
        - dedup=off
        - checksum=on
  ashift: 12

# Additional settings
bootloader: grub
bootPartition: /boot
bootPartitionSize: 1GiB
bootFileSystemType: ext4
rootMountPoint: /
swapSize: 4GiB
swapFileSystemType: zfs
swapDataset: rpool/swap
swapOptions:
  - compression=off
  - swap=on
  - primarycache=metadata

# Partition alignment and safety
alignment: 4096
useGPT: true
secureBoot: true
secureBootAllow: false

# Finalization
postInstallActions:
  - name: update-initramfs
  - name: install-grub-efi
  - name: regenerate-initramfs

# Partition table layout (for reference only; actual layout handled by Calamares)
# 1. EFI System Partition (FAT32)
# 2. Boot partition (ext4)
# 3. ZFS pool (rpool) with datasets for / and /swap
# 4. Reserved space for future expansion

TASK_COMPLETE
