interfaces "*"
network-manager true
hostname kilasos
# Network configuration for Calamares installer
# Interfaces set to wildcard to auto-detect and configure
# NetworkManager enabled for dynamic network management
# Hostname explicitly set to 'kilasos' per requirements
# No static IP or DNS overrides needed for default setup
# DHCP enabled by default via NetworkManager
# IPv4 and IPv6 both supported
# Firewall rules handled separately by system policy
# DNS resolution delegated to NetworkManager's internal service
# No custom routing or bridging required
# WiFi and Ethernet both supported
# Bluetooth tethering disabled by default
# Network isolation not enforced at installer stage
# No proxy configuration required for standard install
# Network timeout defaults apply (30s for DHCP)
# No manual intervention needed post-install
TASK_COMPLETE
