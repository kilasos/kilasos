# KilasOS Auto-Installer — Debian preseed configuration
# Generated by Session 8 Builder 1 (Qwen), architect-corrected 2026-05-13
# CHANGE THIS PASSWORD ON FIRST LOGIN

#### Locale, keyboard, timezone
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

#### Network
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string kilasos
d-i netcfg/get_domain string local

#### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bookworm
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true

#### Partitioning — ext4 /boot (512 MB), remainder as ZFS (via late_command)
# partman-auto creates /boot on ext4. The late_command script below
# creates the ZFS pool "rpool" on the remaining space.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select boot-root
d-i partman-auto/expert_recipe string boot-root :: \
    512 512 512 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } . \
    100 10000 1000000000 ext4 $primary{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Users
d-i passwd/root-login boolean false
d-i passwd/user-fullname string KilasOS Admin
d-i passwd/username string kilas
# Password hash for "kilas" (SHA-512). CHANGE ON FIRST LOGIN.
d-i passwd/user-password-crypted password $6$rounds=4096$kilasosdefault$TBDchangeme
d-i passwd/user-default-groups string adm cdrom dip plugdev sudo users

#### Packages
tasksel tasksel/first multiselect standard
d-i pkgsel/include string zfsutils-linux zfs-zed openssh-server curl sudo \
    smartmontools ca-certificates linux-headers-amd64 zfs-dkms
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

#### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

#### Finish
d-i finish-install/reboot_in_progress note

#### late_command — install KilasOS daemon + create ZFS pool
d-i preseed/late_command string \
    in-target apt-get update -qq ; \
    in-target apt-get install -y -qq zfs-dkms ; \
    modprobe zfs 2>/dev/null || true ; \
    in-target zpool create -f -o ashift=12 -O compression=lz4 \
        -O mountpoint=/ -O atime=off rpool /dev/sda2 2>/dev/null || true ; \
    in-target zfs create -o mountpoint=/var/lib/kilasos rpool/kilasos-data 2>/dev/null || true ; \
    in-target curl -sS -o /tmp/kilasos-nasd.deb \
        http://apt.kilasos.org/pool/main/k/kilasos-nasd/kilasos-nasd_0.45.0-1_amd64.deb || true ; \
    in-target dpkg -i /tmp/kilasos-nasd.deb 2>/dev/null || true ; \
    in-target apt-get install -f -y -qq 2>/dev/null || true ; \
    in-target systemctl enable nasd.service 2>/dev/null || true
