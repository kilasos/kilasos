name: test
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: scripts/test.sh
      - run: scripts/lint.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
